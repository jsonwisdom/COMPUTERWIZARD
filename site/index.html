<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPUTERWIZARD — Attention on Base</title>
<style>
body{background:#05070d;color:white;font-family:Arial;margin:0}
.wrap{padding:20px;max-width:1100px;margin:auto}
.card{background:#0b1020;padding:20px;border-radius:16px;margin-top:20px;border:1px solid #1d4ed8}
button{padding:12px 16px;border-radius:10px;border:none;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>ATTENTION ON BASE</h1>
<img src="../assets/attention-on-base-2026-04-22.jpeg" style="width:100%;border-radius:12px"/>

<div class="card">
<h2>⚡ Filecoin Purpose Engine</h2>
<p>Gamified preservation at machine speed.</p>
<button onclick="runLoop()">RUN LOOP</button>
<pre id="output"></pre>
</div>

<script>
async function runLoop(){
 const res = await fetch('filecoin-purpose.json');
 const data = await res.json();
 let log = '';
 data.game_loop.forEach((step,i)=>{
  log += (i+1)+'. '+step+'\n';
 });
 log += '\nScore Model:\n';
 Object.entries(data.points).forEach(([k,v])=>{
  log += k+': '+v+' pts\n';
 });
 document.getElementById('output').textContent = log;
}
</script>

</div>
</body>
</html>
