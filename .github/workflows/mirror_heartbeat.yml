name: Mirror Truth Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

jobs:
  mirror-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate mirror payload from primary baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path('web/verify.json')
          dst = Path('web/verify.mirror.json')

          data = json.loads(src.read_text())
          data['node'] = 'REMOTE_AUDIT_MIRROR'
          data['mirror_status'] = 'SHADOW_RUNNER_ACTIVE'
          data['mirror_note'] = 'Generated by mirror_heartbeat.yml on an offset schedule. Same-repo staging only; not full adversarial separation.'

          dst.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit mirror heartbeat
        run: |
          set -euo pipefail
          git config user.name "mirror-node-bot"
          git config user.email "mirror@users.noreply.github.com"
          git add web/verify.mirror.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: mirror heartbeat pulse"
          git push
